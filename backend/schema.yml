  /api/v1/inventory/reports/item-card/:
    get:
      operationId: v1_inventory_reports_item_card_retrieve
      description: |-
        Only one user per company works in the inventory module at a time (15 minutes
        idle frees it). Users with inventory.override_lock are never turned away.
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: product
        schema:
          type: integer
        required: true
      - in: query
        name: warehouse
        schema:
          type: integer
