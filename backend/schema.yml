openapi: 3.0.3
info:
  title: Accounting ERP API
  version: 0.1.0
paths:
  /api/v1/accounts/:
    get:
      operationId: v1_accounts_list
      description: Add to views. Set `capability` (APIView) or `capability_by_action`
        (ViewSet).
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
          description: ''
      parameters:
      - name: X-Company-Id
        in: header
        required: false
        schema:
          type: integer
        description: Company to act in. Optional when the user belongs to exactly
          one.
    post:
      operationId: v1_accounts_create
      description: Add to views. Set `capability` (APIView) or `capability_by_action`
        (ViewSet).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
      parameters:
      - name: X-Company-Id
        in: header
        required: false
        schema:
          type: integer
        description: Company to act in. Optional when the user belongs to exactly
          one.
  /api/v1/accounts/{id}/:
