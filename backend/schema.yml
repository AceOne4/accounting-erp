components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 20
        name:
          type: string
          title: Account name
          maxLength: 200
        name_en:
          type: string
          title: Account name (English)
          maxLength: 200
        type:
          $ref: '#/components/schemas/TypeEnum'
        parent:
          type: integer
          nullable: true
        is_leaf:
          type: boolean
          title: Leaf account (accepts entries)
        requires_partner:
          type: boolean
          title: Requires customer/supplier
          description: Enable for receivable and payable accounts
      required:
      - code
      - id
      - name
      - type
    AccountBrief:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        name_en:
          type: string
      required:
      - code
      - id
      - name
      - name_en
    AccountRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
        name:
          type: string
          minLength: 1
          title: Account name
          maxLength: 200
        name_en:
          type: string
          title: Account name (English)
          maxLength: 200
        type:
          $ref: '#/components/schemas/TypeEnum'
        parent:
          type: integer
          nullable: true
        is_leaf:
          type: boolean
          title: Leaf account (accepts entries)
        requires_partner:
          type: boolean
          title: Requires customer/supplier
          description: Enable for receivable and payable accounts
      required:
      - code
      - name
      - type
    Balance:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        side:
          oneOf:
          - $ref: '#/components/schemas/SideEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - amount
      - side
    BlankEnum:
      enum:
      - ''
    CompanyRole:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
      required:
      - id
      - name
      - role
    GeneralLedger:
      type: object
      properties:
        ledgers:
          type: array
          items:
            $ref: '#/components/schemas/Ledger'
      required:
      - ledgers
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    JournalEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 500
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        is_ai_generated:
          type: boolean
          readOnly: true
          title: AI generated
        created_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        posted_by:
          type: string
          readOnly: true
        posted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        total_debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        total_credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        missing_partner_lines:
          type: integer
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLine'
      required:
      - created_at
      - created_by
      - date
      - description
      - id
      - is_ai_generated
      - lines
      - missing_partner_lines
      - posted_at
      - posted_by
      - status
      - total_credit
      - total_debit
    JournalEntryRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 500
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLineRequest'
      required:
      - date
      - description
      - lines
    JournalLine:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        account:
          type: integer
        partner:
          type: integer
          nullable: true
        debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          default: '0.00'
        credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          default: '0.00'
        memo:
          type: string
          title: Notes
          maxLength: 300
      required:
      - account
      - id
    JournalLineRequest:
      type: object
      properties:
        account:
          type: integer
        partner:
          type: integer
          nullable: true
        debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          default: '0.00'
        credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          default: '0.00'
        memo:
          type: string
          title: Notes
          maxLength: 300
      required:
      - account
    KindEnum:
      enum:
      - customer
      - supplier
      - both
      type: string
      description: |-
        * `customer` - Customer
        * `supplier` - Supplier
        * `both` - Customer and supplier
    Ledger:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/AccountBrief'
        is_parent:
          type: boolean
        opening:
          $ref: '#/components/schemas/Balance'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/LedgerRow'
        total_debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        total_credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        closing:
          $ref: '#/components/schemas/Balance'
      required:
      - account
      - closing
      - is_parent
      - opening
      - rows
      - total_credit
      - total_debit
    LedgerRow:
      type: object
      properties:
        date:
          type: string
          format: date
        entry_id:
          type: integer
        status:
          type: string
        description:
          type: string
        memo:
          type: string
        partner:
          allOf:
          - $ref: '#/components/schemas/PartnerBrief'
          nullable: true
        sub_account:
          allOf:
          - $ref: '#/components/schemas/AccountBrief'
          nullable: true
        debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        balance:
          $ref: '#/components/schemas/Balance'
      required:
      - balance
      - credit
      - date
      - debit
      - description
      - entry_id
      - memo
      - partner
      - status
      - sub_account
    Me:
      type: object
      properties:
        companies:
          type: array
          items:
            $ref: '#/components/schemas/CompanyRole'
        username:
          type: string
      required:
      - companies
      - username
