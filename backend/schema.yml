openapi: 3.0.3
info:
  title: Accounting ERP API
  version: 0.1.0
paths:
  /api/v1/accounts/:
    get:
      operationId: v1_accounts_list
      description: Add to views. Set `capability` (APIView) or `capability_by_action`
        (ViewSet).
      tags:
      - v1
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
          description: ''
      parameters:
      - name: X-Company-Id
        in: header
        required: false
        schema:
          type: integer
        description: Company to act in. Optional when the user belongs to exactly
          one.
    post:
      operationId: v1_accounts_create
      description: Add to views. Set `capability` (APIView) or `capability_by_action`
        (ViewSet).
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
      parameters:
      - name: X-Company-Id
        in: header
        required: false
        schema:
          type: integer
        description: Company to act in. Optional when the user belongs to exactly
          one.
  /api/v1/accounts/{id}/:
    get:
      operationId: v1_accounts_retrieve
      description: Add to views. Set `capability` (APIView) or `capability_by_action`
        (ViewSet).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا الحساب.
        required: true
      - name: X-Company-Id
        in: header
        required: false
        schema:
          type: integer
        description: Company to act in. Optional when the user belongs to exactly
          one.
      tags:
      - v1
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
    put:
      operationId: v1_accounts_update
      description: Add to views. Set `capability` (APIView) or `capability_by_action`
        (ViewSet).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا الحساب.
        required: true
      - name: X-Company-Id
        in: header
        required: false
        schema:
          type: integer
        description: Company to act in. Optional when the user belongs to exactly
          one.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
  /api/v1/auth/csrf/:
    get:
      operationId: v1_auth_csrf_retrieve
      description: 'GET: sets the csrftoken cookie. The client sends it back as X-CSRFToken.'
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
      parameters:
      - name: X-Company-Id
        in: header
        required: false
        schema:
          type: integer
        description: Company to act in. Optional when the user belongs to exactly
          one.
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: 'POST: start a session. Rate limited; wrong credentials give one
        generic error.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
      parameters:
      - name: X-Company-Id
        in: header
        required: false
        schema:
          type: integer
        description: Company to act in. Optional when the user belongs to exactly
          one.
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      tags:
      - v1
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
      parameters:
      - name: X-Company-Id
        in: header
        required: false
        schema:
          type: integer
        description: Company to act in. Optional when the user belongs to exactly
          one.
  /api/v1/auth/password/:
    post:
      operationId: v1_auth_password_create
      description: |-
        A signed-in user changes their own password. The current password is required, and the
        new one goes through Django's password validators. Other sessions are signed out.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
      parameters:
      - name: X-Company-Id
        in: header
        required: false
        schema:
          type: integer
        description: Company to act in. Optional when the user belongs to exactly
          one.
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: |-
        POST: exchange username + password for an API token (for the mobile app).
        Send it as `Authorization: Token <key>`; no CSRF is needed for token requests.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
      parameters:
      - name: X-Company-Id
        in: header
        required: false
        schema:
          type: integer
        description: Company to act in. Optional when the user belongs to exactly
          one.
  /api/v1/auth/token/revoke/:
    post:
      operationId: v1_auth_token_revoke_create
