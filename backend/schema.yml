          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: incomplete
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
      - in: query
        name: status
