          - $ref: '#/components/schemas/PartnerBrief'
          nullable: true
        sub_account:
          allOf:
          - $ref: '#/components/schemas/AccountBrief'
          nullable: true
        debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        balance:
          $ref: '#/components/schemas/Balance'
      required:
      - balance
      - credit
      - date
      - debit
      - description
      - entry_id
      - memo
      - partner
      - status
      - sub_account
    LockStatus:
      type: object
