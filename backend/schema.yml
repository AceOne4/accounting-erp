components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          title: الكود
          maxLength: 20
        name:
          type: string
          title: اسم الحساب
          maxLength: 200
        name_en:
          type: string
          title: اسم الحساب (بالإنجليزية)
          maxLength: 200
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          title: النوع
        parent:
          type: integer
          nullable: true
        is_leaf:
          type: boolean
          title: حساب فرعي (يقبل قيود)
        requires_partner:
          type: boolean
          title: يتطلب تحديد عميل/مورد
          description: فعّلها لحسابات العملاء والموردين
      required:
      - code
      - id
      - name
      - type
    AccountBrief:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        name_en:
          type: string
      required:
      - code
      - id
      - name
      - name_en
    AccountRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          title: الكود
          maxLength: 20
        name:
          type: string
          minLength: 1
          title: اسم الحساب
          maxLength: 200
        name_en:
          type: string
          title: اسم الحساب (بالإنجليزية)
          maxLength: 200
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          title: النوع
        parent:
          type: integer
          nullable: true
        is_leaf:
          type: boolean
          title: حساب فرعي (يقبل قيود)
        requires_partner:
          type: boolean
          title: يتطلب تحديد عميل/مورد
          description: فعّلها لحسابات العملاء والموردين
      required:
      - code
      - name
      - type
    Balance:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        side:
          oneOf:
          - $ref: '#/components/schemas/SideEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - amount
      - side
    BlankEnum:
      enum:
      - ''
    BoxFigures:
      type: object
      properties:
        account:
          type: integer
        code:
          type: string
        name:
          type: string
        posted:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        pending:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        book:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
      required:
      - account
      - book
      - code
      - name
      - pending
      - posted
    CashCount:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        box:
          type: integer
          readOnly: true
        box_code:
          type: string
          readOnly: true
        count_date:
          type: string
          format: date
          readOnly: true
          title: تاريخ الجرد
        counted_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          readOnly: true
          title: النقدية بالجرد
        book_balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          readOnly: true
          title: الرصيد الدفتري
        difference:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          readOnly: true
          title: الفرق
        breakdown:
          readOnly: true
          title: تفصيل الفئات
        notes:
          type: string
          readOnly: true
          title: ملاحظات
        counted_by:
          type: string
          readOnly: true
        entry:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - book_balance
      - box
      - box_code
      - breakdown
      - count_date
      - counted_by
      - counted_total
      - created_at
      - difference
      - entry
      - id
      - notes
    CashCountCreateRequest:
      type: object
      properties:
        box:
          type: integer
        count_date:
          type: string
          format: date
        quantities:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: 'Quantity per denomination, e.g. {''200'': 3, ''0.5'': 4}'
        notes:
          type: string
          default: ''
          maxLength: 300
        adjust:
          type: boolean
          default: false
      required:
      - box
      - quantities
    CompanyRole:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        capabilities:
          type: array
          items:
            type: string
      required:
      - capabilities
      - id
      - name
      - role
    Count:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
        warehouse:
          type: integer
          readOnly: true
        counted_at:
          type: string
          format: date-time
          readOnly: true
        counted_by:
          type: string
          readOnly: true
        notes:
          type: string
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CountLine'
          readOnly: true
      required:
      - counted_at
      - counted_by
      - id
      - lines
      - notes
      - number
      - warehouse
    CountCreateRequest:
      type: object
      properties:
        warehouse:
          type: integer
        notes:
          type: string
          default: ''
          maxLength: 300
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CountInputLineRequest'
      required:
      - lines
      - warehouse
    CountInputLineRequest:
      type: object
      properties:
        product:
          type: integer
        counted_qty:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
      required:
      - counted_qty
      - product
    CountLine:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
          readOnly: true
        product_code:
          type: string
          readOnly: true
        book_qty:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        counted_qty:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        difference:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
      required:
      - book_qty
      - counted_qty
      - difference
      - id
      - product
      - product_code
    CsrfToken:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    GeneralLedger:
      type: object
      properties:
        ledgers:
          type: array
          items:
            $ref: '#/components/schemas/Ledger'
      required:
      - ledgers
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    ItemCard:
      type: object
      properties:
        opening_qty:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        opening_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ItemCardRow'
      required:
      - opening_qty
      - opening_value
      - rows
    ItemCardRow:
      type: object
      properties:
        date:
          type: string
          format: date
        doc_type:
          type: string
        doc_id:
          type: integer
        doc_number:
          type: string
        warehouse:
          type: integer
        qty_in:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          nullable: true
        qty_out:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          nullable: true
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        balance_qty:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        balance_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
      required:
      - balance_qty
      - balance_value
      - date
      - doc_id
      - doc_number
      - doc_type
      - qty_in
      - qty_out
      - value
      - warehouse
    JournalEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
          title: التاريخ
        description:
          type: string
          title: البيان
          maxLength: 500
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
          title: الحالة
        is_ai_generated:
          type: boolean
          readOnly: true
          title: مُنشأ بالذكاء الاصطناعي
        source:
          type: string
          readOnly: true
          title: المصدر
        created_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: تاريخ الإنشاء
        posted_by:
          type: string
          readOnly: true
        posted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: تاريخ الترحيل
        total_debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        total_credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        missing_partner_lines:
          type: integer
          readOnly: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLine'
      required:
      - created_at
      - created_by
      - date
      - description
      - id
      - is_ai_generated
      - lines
      - missing_partner_lines
      - posted_at
      - posted_by
      - source
      - status
      - total_credit
      - total_debit
    JournalEntryRequest:
      type: object
      properties:
        date:
          type: string
          format: date
          title: التاريخ
        description:
          type: string
          minLength: 1
          title: البيان
          maxLength: 500
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLineRequest'
      required:
      - date
      - description
      - lines
    JournalLine:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        account:
          type: integer
        partner:
          type: integer
          nullable: true
        debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          default: '0.00'
        credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          default: '0.00'
        memo:
          type: string
          title: ملاحظات
          maxLength: 300
      required:
      - account
      - id
    JournalLineRequest:
      type: object
      properties:
        account:
          type: integer
        partner:
          type: integer
          nullable: true
        debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          default: '0.00'
        credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          default: '0.00'
        memo:
          type: string
          title: ملاحظات
          maxLength: 300
      required:
      - account
    Ledger:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/AccountBrief'
        is_parent:
          type: boolean
        opening:
          $ref: '#/components/schemas/Balance'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/LedgerRow'
        total_debit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        total_credit:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        closing:
          $ref: '#/components/schemas/Balance'
      required:
      - account
      - closing
      - is_parent
      - opening
      - rows
      - total_credit
      - total_debit
    LedgerComparison:
      type: object
      properties:
        posted:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        all:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        difference:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
      required:
      - all
      - difference
      - posted
    LedgerRow:
      type: object
      properties:
        date:
          type: string
          format: date
        entry_id:
          type: integer
        status:
          type: string
        description:
          type: string
        memo:
          type: string
        partner:
